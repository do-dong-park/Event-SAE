name: event-sae-dev

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pyyaml
  - pytest
  - pytorch=2.2.0
  - pytorch-cuda=12.1
  - torchvision=0.17.0
  - pip:
      # Conda의 CUDA 12.1 빌드를 pip resolver가 덮어쓰지 못하게 고정한다.
      - torch==2.2.0
      - torchvision==0.17.0
      - numpy==1.26.4
      - transformers==4.48.1
      - tokenizers==0.21.2
      - accelerate
      - einops
      - nnsight==0.3.3
      - tqdm
      - wandb
      # AWE kinematic keyframes. Keep OpenCV pinned below 5 so pip does not
      # upgrade the NumPy 1.26 training contract to NumPy 2.x.
      - matplotlib==3.10.9
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - moviepy==2.2.1
      - pillow==11.3.0
      - decorator==5.2.1
      - opencv-python==4.11.0.86
      - opencv-python-headless==4.11.0.86
      - mujoco==3.8.0
      - robosuite==1.4.0
      - termcolor==3.3.0
      - git+https://github.com/xc-j/awe.git@7197bb86a20784666dabed90e6eabcf8bb1e9912
      # Event-SAE가 사용하는 upstream SAE 구현과 검증된 commit.
      - git+https://github.com/saprmarks/dictionary_learning.git@60ec6bf
