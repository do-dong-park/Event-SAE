# Example: run a LIBERO-Spatial closed-loop eval for openpi (π₀.₅), client side.
#
# Expects an openpi policy server to be running on the host:port below.
# Start the server (event-sae conda env) with the public wrapper:
#
#   python scripts/openpi/serve_policy.py --env libero \
#       --mode dense \
#       --capture-target action_expert \
#       --layer-indices 0,5,11,17 \
#       --output-root logs/openpi/sae_collection \
#       --run-name my_run_tag
#
# Then in the LIBERO sim env:
#
#   python scripts/openpi/eval_libero.py --config configs/examples/openpi/eval_libero_spatial.yaml

server:
  host: 127.0.0.1
  port: 8000
  resize_size: 224
  replan_steps: 5

env:
  task_suite_name: libero_spatial
  task_ids: null            # null = all 10 tasks; otherwise a list, e.g. [0,1]
  num_trials_per_task: 50   # paper scale; the public minimal runbook overrides this to 5
  num_steps_wait: 10
  seed: 7

logging:
  root_dir: logs/openpi
  run_tag: ""               # blank = use task_suite_name
  save_video: true
  save_actions: true
  save_chunk_records: true
  save_prompt_records: true
  save_trajectory_records: true

libero:
  config_path: examples/libero/libero_config
  mujoco_gl: egl

# This block is informational; the actual SAE collection settings live on
# the policy server side (see serve_policy.py args above). The client just
# forwards `_sae_collection_context` when the server advertises collection.
sae_collect:
  enabled: false            # set true to expect server-side collection
  mode: dense               # "dense" or "topk"
  capture_target: action_expert
  layer_idxs: "0,5,11,17"
